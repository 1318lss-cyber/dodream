<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>두드림 문자</title>
<meta name="theme-color" content="#131c2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="두드림 문자">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#131c2e; --navy2:#1d2a42; --ink:#232a35; --paper:#f2f4f7; --card:#fff;
  --red:#d3273e; --red-dark:#a81d30; --line:#e3e6ec; --muted:#7a8496; --ok:#1d7a4f;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--paper);color:var(--ink);
  overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}

/* ── 상단바 ── */
.appbar{
  position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
  display:flex;align-items:center;gap:11px;
}
.mark{width:34px;height:34px;border-radius:9px;background:var(--red);display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:17px;flex-shrink:0}
.appbar h1{font-size:16.5px;font-weight:900;letter-spacing:-.4px}
.appbar p{font-size:11px;color:#a9b3c7;margin-top:1px}

/* ── 본문 ── */
main{padding:14px 14px calc(96px + var(--safe-b));max-width:560px;margin:0 auto}
.page{display:none}
.page.on{display:block}

.sect{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sect-t{font-size:13px;font-weight:900;color:var(--navy);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.sect-t::before{content:"";width:3px;height:14px;background:var(--red);border-radius:2px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;font-size:14px;
  font-family:inherit;color:var(--ink);cursor:pointer;transition:.12s;min-height:44px}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
.chip:active{transform:scale(.97)}

textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink);resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--navy)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 7px}
.sub{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.gap{margin-top:15px}

.sw{display:flex;align-items:flex-start;gap:11px;background:#f8f2f3;border:1px solid #eddade;
  border-radius:12px;padding:12px;margin-top:12px}
.sw.plain{background:#f3f5f8;border-color:#e2e7ee}
.sw input{margin-top:2px;width:19px;height:19px;accent-color:var(--red);flex-shrink:0}
.sw b{font-size:13.5px;display:block}
.sw span{font-size:11.5px;color:var(--muted);line-height:1.5;display:block;margin-top:2px}

/* ── 하단 고정 버튼 ── */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(242,244,247,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + var(--safe-b));
  display:flex;gap:9px;max-width:560px;margin:0 auto;
}
.dock .tabbtn{
  width:52px;border:1.5px solid var(--line);background:#fff;border-radius:13px;
  font-size:11px;font-weight:700;color:var(--muted);font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0
}
.dock .tabbtn.on{border-color:var(--navy);color:var(--navy)}
.dock .tabbtn svg{width:19px;height:19px}
.mainbtn{flex:1;background:var(--red);color:#fff;border:none;border-radius:13px;padding:16px;
  font-size:16.5px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:-.3px}
.mainbtn:active{background:var(--red-dark)}

/* ── 결과 시트 ── */
.scrim{position:fixed;inset:0;background:rgba(15,20,32,.5);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);
  border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-width:560px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.on{transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}.scrim{transition:none}}
.grab{padding:10px 0 4px;display:flex;justify-content:center;flex-shrink:0}
.grab i{width:38px;height:4px;border-radius:3px;background:#c7ccd6;display:block}
.sheet-head{padding:4px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.sheet-head h3{font-size:15px;font-weight:900}
.sheet-head button{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);
  cursor:pointer;padding:4px 8px;font-family:inherit;line-height:1}
.sheet-body{overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}

.vtabs{display:flex;gap:6px;margin-bottom:11px}
.vtabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px;
  font-size:13px;font-weight:700;color:var(--muted);font-family:inherit;cursor:pointer;min-height:44px}
.vtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}

.msgwrap{background:var(--navy);border-radius:18px;padding:13px}
.msgtop{font-size:11px;color:#9aa5bb;text-align:center;margin-bottom:9px;font-weight:700}
.bubble{background:#fff;border-radius:5px 16px 16px 16px;padding:13px 15px;font-size:14.5px;line-height:1.72;
  white-space:pre-wrap;word-break:break-all;max-height:38vh;overflow-y:auto}
.bytebar{display:flex;justify-content:space-between;margin-top:9px;padding:0 3px;font-size:11.5px;color:#9aa5bb}
.bytebar b.over{color:#ff8896}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.acts button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:14px;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;min-height:48px}
.acts button.wide{grid-column:1/-1;background:var(--navy);color:#fff}
.acts button.done{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button:active{opacity:.8}

.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%) translateY(10px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:22px;
  z-index:80;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="appbar">
  <div class="mark">두</div>
  <div>
    <h1>두드림 문자</h1>
    <p>고객 문자 자동 작성 · 오프라인 사용 가능</p>
  </div>
</div>

<main>
  <!-- ══ 만들기 ══ -->
  <div class="page on" id="pageMake">
    <div class="sect">
      <div class="sect-t">문자 주제</div>
      <div class="chips" id="topicChips"></div>
    </div>

    <div class="sect">
      <div class="sect-t">받는 고객</div>
      <div class="chips" id="targetChips"></div>
      <div class="gap"><span class="lbl">말투</span><div class="chips" id="toneChips"></div></div>
      <div class="gap"><span class="lbl">길이</span><div class="chips" id="lenChips"></div></div>
    </div>

    <div class="sect">
      <div class="sect-t">이번 주 한 줄 추가</div>
      <textarea id="extraInput" rows="2" placeholder="예) 그랜저 IG 2019년식 무사고 신규 입고"></textarea>
      <p class="sub">비워두면 넣지 않습니다. 입력하면 본문에 그대로 한 줄 들어갑니다.</p>
    </div>
  </div>

  <!-- ══ 설정 ══ -->
  <div class="page" id="pageSet">
    <div class="sect">
      <div class="sect-t">매장 정보</div>
      <span class="lbl">상호</span>
      <input type="text" id="shopName" placeholder="두드림모터스">
      <div class="gap"><span class="lbl">이름 / 직함</span>
        <input type="text" id="ownerName" placeholder="이성신 대표딜러"></div>
      <div class="gap"><span class="lbl">연락처</span>
        <input type="text" id="phoneInput" inputmode="tel" placeholder="010-0000-0000"></div>
      <div class="gap"><span class="lbl">무료수신거부 번호</span>
        <input type="text" id="optoutInput" inputmode="tel" placeholder="080-000-0000"></div>
      <p class="sub">문자 발송 업체(알리고·솔라피 등)에서 발급받은 080 번호를 넣으세요.</p>
    </div>

    <div class="sect">
      <div class="sect-t">문자 규정</div>
      <label class="sw">
        <input type="checkbox" id="adToggle" checked>
        <div><b>광고성 문자 규정 자동 적용</b>
        <span>맨 앞에 (광고), 맨 끝에 무료수신거부 번호를 자동으로 넣습니다. 입고·이벤트 홍보 문자라면 반드시 켜두세요. 정보통신망법상 필수입니다.</span></div>
      </label>
      <label class="sw plain">
        <input type="checkbox" id="nameToggle">
        <div><b>고객 이름 자동 치환 넣기</b>
        <span>문자에 #{이름} 고객님 을 넣습니다. 발송 사이트에 엑셀 명단을 올리면 이름이 자동으로 채워집니다.</span></div>
      </label>
      <p class="sub">설정한 내용은 이 기기에 저장되어 다음에 열 때 그대로 유지됩니다.</p>
    </div>
  </div>
</main>

<!-- ══ 하단 고정 ══ -->
<div class="dock">
  <button class="tabbtn on" id="tabMake" aria-label="만들기 화면">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    만들기
  </button>
  <button class="tabbtn" id="tabSet" aria-label="설정 화면">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    설정
  </button>
  <button class="mainbtn" id="genBtn">문자 만들기</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="문자 결과">
  <div class="grab"><i></i></div>
  <div class="sheet-head">
    <h3>완성된 문자</h3>
    <button id="closeSheet" aria-label="닫기">×</button>
  </div>
  <div class="sheet-body">
    <div class="vtabs" id="vtabs">
      <button class="on" data-v="0">A안</button>
      <button data-v="1">B안</button>
      <button data-v="2">C안</button>
    </div>
    <div class="msgwrap">
      <div class="msgtop" id="senderLabel">두드림모터스</div>
      <div class="bubble" id="bubble"></div>
      <div class="bytebar"><span id="lenLabel"></span><span><b id="byteNum">0</b> byte</span></div>
    </div>
    <div class="acts">
      <button class="wide" id="sendBtn">문자앱으로 보내기</button>
      <button id="copyBtn">복사하기</button>
      <button id="reBtn">다시 뽑기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══ 문안 데이터 ══ */
const TOPICS=["주간 인사 + 관리 팁","신차 입고 소식","계절 점검 안내","내차팔기·보상판매","이벤트·프로모션","명절·기념일 인사","출고 고객 감사 안부"];
const TARGETS=["전체 고객","최근 출고 고객","상담 중인 고객","1년 이상 장기 고객"];
const TONES=["따뜻하고 정중하게","친근한 사장님","짧고 담백하게"];
const LENS=["SMS 단문","LMS 장문"];

const GREET={
 1:["새해 첫 달, 올 한 해 계획은 잘 세우고 계신지요.","매서운 한파에 아침 시동 걸기도 쉽지 않은 요즘입니다.","새해 복 많이 받으시고 올해도 안전 운행하시길 바랍니다."],
 2:["겨울 끝자락, 아침저녁 찬 기운이 아직 매섭습니다.","입춘이 지나도 도로 살얼음은 여전히 조심스러운 시기입니다.","한 해를 시작하며 차량도 한 번 살펴볼 때입니다."],
 3:["봄기운이 스며드는 3월, 나들이 계획은 세우셨는지요.","겨우내 고생한 차량을 돌봐줄 시기가 찾아왔습니다.","꽃샘추위만 지나면 본격적인 봄 드라이브 철입니다."],
 4:["벚꽃이 한창인 계절, 창문 열고 달리기 좋은 날씨입니다.","완연한 봄날, 가족 나들이 다녀오기 좋은 요즘입니다.","황사와 미세먼지가 잦은 시기라 차량 관리가 더 중요합니다."],
 5:["가정의 달 5월, 가족과 좋은 시간 보내고 계신지요.","1년 중 가장 운전하기 좋은 계절이 찾아왔습니다.","연휴가 많은 달인 만큼 장거리 운행이 잦아지는 시기입니다."],
 6:["초여름 더위가 시작되며 에어컨을 켜기 시작하는 때입니다.","장마를 앞두고 미리 챙겨두면 좋은 것들이 있습니다.","한낮 기온이 부쩍 오르는 6월입니다."],
 7:["장마와 무더위가 겹치는 가장 까다로운 계절입니다.","여름휴가 준비는 어떻게 되어 가시는지요.","폭염에 차량도 사람도 지치기 쉬운 시기입니다."],
 8:["한여름 무더위, 건강하게 잘 지내고 계신지요.","휴가철 장거리 운행이 많아지는 8월입니다.","늦더위와 태풍이 함께 오는 시기라 대비가 필요합니다."],
 9:["아침저녁 선선한 바람이 부는 좋은 계절이 왔습니다.","추석을 앞두고 마음이 분주해지는 9월입니다.","여름 내내 고생한 차량을 살펴줄 시기입니다."],
 10:["단풍이 물드는 10월, 드라이브하기 참 좋은 날씨입니다.","가을 나들이 계획은 세우셨는지요.","일교차가 큰 계절, 차량 컨디션도 함께 챙기실 때입니다."],
 11:["겨울 문턱, 첫 추위를 대비할 시기가 되었습니다.","해가 짧아져 야간 운행이 부쩍 늘어나는 요즘입니다.","한 해가 저물어 가는 11월, 잘 지내고 계신지요."],
 12:["한 해를 마무리하는 12월, 어떻게 지내고 계신지요.","눈길과 빙판길이 시작되는 계절입니다.","올 한 해도 마무리 잘 하시길 바랍니다."]
};
const TIPS={
 1:["영하권 장기 주차 시 사이드브레이크 대신 P단과 고임목을 쓰면 라이닝 동결을 막을 수 있습니다.","겨울철 배터리는 성능이 크게 떨어집니다. 3년 이상 됐다면 미리 점검해 보세요.","워셔액이 얼면 통이 깨집니다. 겨울용인지 한 번 확인해 보세요."],
 2:["제설제가 하부에 남아 부식을 부릅니다. 하부 세차 한 번 해두시면 좋습니다.","날이 풀리기 전 부동액 농도 점검을 권해드립니다.","기온이 낮으면 타이어 공기압이 떨어집니다. 한 번 확인해 보세요."],

const S={topic:0,target:0,tone:0,len:1,variants:["","",""],cur:0};
const KEY="dodream_sms_v1";
const $=id=>document.getElementById(id);

function saveSet(){
  try{localStorage.setItem(KEY,JSON.stringify({
    shop:$("shopName").value,owner:$("ownerName").value,phone:$("phoneInput").value,
    optout:$("optoutInput").value,ad:$("adToggle").checked,nm:$("nameToggle").checked,
    topic:S.topic,target:S.target,tone:S.tone,len:S.len
  }));}catch(e){}
}
function loadSet(){
  let d={};
  try{d=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){}
  $("shopName").value=d.shop??"두드림모터스";
  $("ownerName").value=d.owner??"이성신 대표딜러";
  $("phoneInput").value=d.phone??"";
  $("optoutInput").value=d.optout??"";
  $("adToggle").checked=d.ad!==false;
  $("nameToggle").checked=!!d.nm;
  if(Number.isInteger(d.topic))S.topic=d.topic;
  if(Number.isInteger(d.target))S.target=d.target;
  if(Number.isInteger(d.tone))S.tone=d.tone;
  if(Number.isInteger(d.len))S.len=d.len;
}

function chips(id,items,key){
  const box=$(id);box.innerHTML="";
  items.forEach((t,i)=>{
    const b=document.createElement("button");
    b.type="button";b.className="chip"+(S[key]===i?" on":"");b.textContent=t;
    b.onclick=()=>{S[key]=i;chips(id,items,key);saveSet();};
    box.appendChild(b);
  });
}

  chips("topicChips",TOPICS,"topic");chips("targetChips",TARGETS,"target");

/* ══ 생성 ══ */
function pick(a,u){if(!a||!a.length)return"";const p=a.filter(x=>!u.includes(x));const s=p.length?p:a;
  const v=s[Math.floor(Math.random()*s.length)];u.push(v);return v;}
function bytes(s){let n=0;for(const c of s)n+=c.charCodeAt(0)>127?2:1;return n;}
function fresh(){return{g:[],b:[],t:[],c:[],tg:[]};}

function make(u){
  const m=new Date().getMonth()+1;
  const shop=$("shopName").value.trim()||"두드림모터스";
  const owner=$("ownerName").value.trim();
  const phone=$("phoneInput").value.trim();
  const optout=$("optoutInput").value.trim()||"080-000-0000";
  const extra=$("extraInput").value.trim();
  const ad=$("adToggle").checked,useName=$("nameToggle").checked,isSMS=S.len===0;

  if(isSMS){
    let s=(ad?"(광고) ":"")+"["+shop+"] ";
    if(useName)s+="#{이름} 고객님, ";
    s+=pick(SMS_BODY[S.topic],u.b);
    if(extra)s+=" "+extra;
    if(phone)s+=" ☎"+phone;
    if(ad)s+="\n무료수신거부 "+optout;
    return s;
  }
  const L=[];
  L.push((ad?"(광고) ":"")+"["+shop+"]");L.push("");
  L.push((useName?"#{이름} 고객님, ":"고객님, ")+pick(GREET[m],u.g));
  const tl=TARGET_LINE[S.target];if(tl&&tl.length)L.push(pick(tl,u.tg));
  L.push("");L.push(pick(BODY[S.topic],u.b));
  if(S.topic===0||S.topic===2){L.push("");L.push("▪ 이달의 관리 팁");L.push(pick(TIPS[m],u.t));}
  if(extra){L.push("");L.push("▪ "+extra);}
  L.push("");L.push(pick(CLOSER[S.tone],u.c));
  L.push("");L.push("― "+shop+(owner?" "+owner:""));
  if(phone)L.push("☎ "+phone);
  if(ad)L.push("무료수신거부 "+optout);
  return L.join("\n");
}

function show(i){
  S.cur=i;
  document.querySelectorAll("#vtabs button").forEach((b,bi)=>b.classList.toggle("on",bi===i));
  const t=S.variants[i];
  $("bubble").textContent=t;
  const b=bytes(t),lim=S.len===0?90:2000;
  $("byteNum").textContent=b.toLocaleString();
  $("byteNum").classList.toggle("over",b>lim);
  $("lenLabel").textContent=S.len===0?"SMS 90byte 제한":"LMS 2,000byte 제한";
}
document.querySelectorAll("#vtabs button").forEach(b=>b.onclick=()=>show(+b.dataset.v));

/* ══ 시트 ══ */
function openSheet(){$("scrim").classList.add("on");$("sheet").classList.add("on");document.body.style.overflow="hidden";}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");document.body.style.overflow="";}
$("scrim").onclick=closeSheet;$("closeSheet").onclick=closeSheet;

let toastT;
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),1700);}

$("genBtn").onclick=()=>{
  const u=fresh();
  S.variants=[make(u),make(u),make(u)];
  const shop=$("shopName").value.trim()||"두드림모터스";
  const owner=$("ownerName").value.trim();
  $("senderLabel").textContent=shop+(owner?" "+owner:"");
  show(0);openSheet();saveSet();
};

$("copyBtn").onclick=async()=>{
  const t=S.variants[S.cur];
  try{await navigator.clipboard.writeText(t);}
  catch(e){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}
  const b=$("copyBtn");b.classList.add("done");b.textContent="복사 완료";
  setTimeout(()=>{b.classList.remove("done");b.textContent="복사하기";},1500);
};

$("sendBtn").onclick=()=>{
  const t=S.variants[S.cur];

};

$("tabMake").onclick=()=>{
